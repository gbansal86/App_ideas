<!doctype html><html><head><meta charset="utf-8"><title>Marketplace Listings</title><link rel="stylesheet" href="style.css"></head>
<body class="dashboard"><header><div><h1>Marketplace Listings</h1><p id="summary"></p></div><div class="actions"><button id="download">Download all listing files</button><button id="json">Export JSON</button><button id="csv">Export CSV</button><button id="clear" class="danger">Clear all</button></div></header>
<section class="filters"><input id="search" placeholder="Search title, location or description"><select id="sort"><option value="new">Newest captured</option><option value="title">Title A–Z</option><option value="priceLow">Price low–high</option><option value="priceHigh">Price high–low</option></select></section>
<section class="batch"><h2>Batch capture listing links (maximum 20 at a time)</h2><p>Accepts Marketplace item links and Facebook Copy Link/share URLs.</p><textarea id="links" placeholder="Paste one Facebook Marketplace or Facebook share URL per line"></textarea><button id="captureLinks">Capture full listings</button><button id="cancelBatch" class="danger" hidden>Stop after current listing</button><button id="addLinks">Add direct item links only</button><span id="batchStatus"></span></section>
<main id="cards"></main><div id="empty">No listings saved yet. Open Marketplace and use the extension button.</div><script src="shared.js"></script><script src="dashboard.js"></script></body></html>
